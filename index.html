<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Clinica - Glass Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.8);
            --apple-blue: #007aff;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
            min-height: 100vh;
        }

        header { 
            background: rgba(29, 29, 31, 0.9); 
            backdrop-filter: blur(15px);
            color: white; padding: 20px; text-align: center; font-size: 22px; font-weight: 600;
        }

        .back-btn { position: absolute; left: 20px; color: white; text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 12px; }

        .container { padding: 20px; max-width: 1100px; margin: auto; }

        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px);
            padding: 25px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            margin-top: 20px;
        }

        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        
        button { 
            padding: 10px 15px; border-radius: 12px; border: 1px solid #ddd; 
            cursor: pointer; background: white; font-weight: 600; color: var(--apple-blue);
        }

        button.active { background: var(--apple-blue); color: white; border-color: var(--apple-blue); }

        #status { text-align: center; font-size: 14px; margin-bottom: 10px; color: #666; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">← Lista</a>
    Analisi Parametri
</header>

<div class="container">
    <div id="status">Caricamento dati...</div>

    <div class="controls">
        <button id="btn-all" onclick="updateChart('all')" class="active">Tutti</button>
        <button id="btn-30" onclick="updateChart(30)">30 Giorni</button>
        <button id="btn-7" onclick="updateChart(7)">7 Giorni</button>
        <button id="btn-month" onclick="updateChart('monthly')" style="border-color: var(--apple-orange);">📊 Media Mensile</button>
    </div>

    <div class="card">
        <div style="position: relative; height:60vh; width:100%">
            <canvas id="healthChart"></canvas>
        </div>
    </div>
</div>

<script>
    let records = [];
    let healthChart = null;
    const config = JSON.parse(localStorage.getItem('gh_health_config'));

    async function fetchData() {
        if (!config) {
            document.getElementById('status').innerText = "Errore: Configura GitHub nella home";
            return;
        }
        const url = `https://api.github.com/repos/${config.repo}/contents/dati.json`;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${config.token}` } });
            if (res.ok) {
                const data = await res.json();
                records = JSON.parse(atob(data.content));
                records.sort((a, b) => new Date(a.data + " " + a.ora) - new Date(b.data + " " + b.ora));
                document.getElementById('status').innerText = `Trovate ${records.length} misurazioni`;
                updateChart('all');
            }
        } catch (e) { document.getElementById('status').innerText = "Errore di connessione"; }
    }

    function updateChart(filter) {
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + (filter === 'monthly' ? 'month' : filter)).classList.add('active');

        const ctx = document.getElementById('healthChart').getContext('2d');
        let labels, sysData, diaData, bpmData;

        if (filter === 'monthly') {
            // LOGICA RAGGRUPPAMENTO PER MESE
            const monthlyStats = {};
            records.forEach(r => {
                const monthKey = r.data.substring(0, 7); // Prende "YYYY-MM"
                if (!monthlyStats[monthKey]) {
                    monthlyStats[monthKey] = { s: 0, d: 0, b: 0, count: 0 };
                }
                monthlyStats[monthKey].s += parseInt(r.massima);
                monthlyStats[monthKey].d += parseInt(r.minima);
                monthlyStats[monthKey].b += parseInt(r.pulsazioni || r.bpm || 0);
                monthlyStats[monthKey].count++;
            });

            labels = Object.keys(monthlyStats).map(m => {
                const [y, mm] = m.split('-');
                const date = new Date(y, mm - 1);
                return date.toLocaleString('it-IT', { month: 'long', year: 'numeric' });
            });
            sysData = Object.values(monthlyStats).map(v => Math.round(v.s / v.count));
            diaData = Object.values(monthlyStats).map(v => Math.round(v.d / v.count));
            bpmData = Object.values(monthlyStats).map(v => Math.round(v.b / v.count));
            
            document.getElementById('status').innerText = "Visualizzazione: Media Mensile";
        } else {
            // LOGICA STANDARD (Tutti / 30 / 7 giorni)
            let dataToShow = [...records];
            if (filter !== 'all') {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - filter);
                dataToShow = records.filter(r => new Date(r.data) >= cutoff);
            }
            labels = dataToShow.map(r => {
                const d = new Date(r.data);
                return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) + " " + r.ora;
            });
            sysData = dataToShow.map(r => parseInt(r.massima));
            diaData = dataToShow.map(r => parseInt(r.minima));
            bpmData = dataToShow.map(r => parseInt(r.pulsazioni || r.bpm || 0));
            document.getElementById('status').innerText = `Visualizzazione: ${dataToShow.length} misure`;
        }

        if (healthChart) healthChart.destroy();

        healthChart = new Chart(ctx, {
            type: filter === 'monthly' ? 'bar' : 'line', // Istogramma per i mesi, linea per il quotidiano
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Sistolica (MAX)',
                        data: sysData,
                        borderColor: '#ff3b30',
                        backgroundColor: filter === 'monthly' ? 'rgba(255, 59, 48, 0.6)' : 'rgba(255, 59, 48, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: sysData.map(v => v >= 140 ? 7 : 4),
                        pointBackgroundColor: sysData.map(v => v >= 140 ? '#ff3b30' : 'white')
                    },
                    {
                        label: 'Diastolica (MIN)',
                        data: diaData,
                        borderColor: '#ff9500',
                        backgroundColor: filter === 'monthly' ? 'rgba(255, 149, 0, 0.6)' : 'rgba(255, 149, 0, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: diaData.map(v => v >= 90 ? 7 : 4),
                        pointBackgroundColor: diaData.map(v => v >= 90 ? '#ff9500' : 'white')
                    },
                    {
                        label: 'BPM',
                        data: bpmData,
                        borderColor: '#007aff',
                        borderWidth: 2,
                        type: 'line', // I battiti rimangono sempre una linea
                        pointRadius: 2,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    y: {
                        suggestedMin: 50,
                        suggestedMax: 160,
                        grid: {
                            color: (context) => (context.tick.value === 140 || context.tick.value === 90 ? 'rgba(255, 0, 0, 0.4)' : 'rgba(0,0,0,0.05)')
                        }
                    }
                }
            }
        });
    }

    fetchData();
</script>

</body>
</html>
