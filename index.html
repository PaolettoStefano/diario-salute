<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salute Personale - Monitoraggio</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --apple-blue: #007aff;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
            --apple-green: #34c759;
            --text-main: #1d1d1f;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header { 
            background: rgba(29, 29, 31, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white; padding: 25px; text-align: center; 
            font-size: 26px; font-weight: 600; 
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .container { padding: 20px; max-width: 900px; margin: auto; }

        #status { 
            text-align: center; padding: 10px; margin-bottom: 20px;
            background: var(--glass-bg); border-radius: 12px; font-size: 14px;
        }

        /* Pulsanti Glass */
        .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; }
        
        button { 
            padding: 12px 20px; border-radius: 14px; border: 1px solid var(--glass-border); 
            cursor: pointer; font-weight: 600; font-size: 15px;
            transition: all 0.3s ease; backdrop-filter: blur(5px);
        }

        .primary { background: var(--apple-blue); color: white; border: none; }
        .success { background: var(--apple-green); color: white; border: none; }
        .export { background: rgba(255,255,255,0.5); color: var(--text-main); }
        .danger { background: rgba(255, 59, 48, 0.1); color: var(--apple-red); border: none; }
        .warning { background: rgba(255, 149, 0, 0.15); color: #c67c00; border: none; }

        button:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* GitHub Config Collapsible */
        .collapsible { background: var(--glass-bg); width: 100%; text-align: left; margin-bottom: 10px; }
        .content { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; padding: 0 20px; }

        /* Month Grouping */
        .month-section { margin-bottom: 20px; border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); }
        
        .month-header { 
            background: rgba(255, 255, 255, 0.5); 
            padding: 18px 25px; cursor: pointer; display: flex; 
            justify-content: space-between; align-items: center;
            font-weight: 700; font-size: 18px; backdrop-filter: blur(10px);
        }

        .month-header:hover { background: rgba(255, 255, 255, 0.8); }

        .table-container { background: var(--glass-bg); padding: 10px; overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { color: #86868b; font-size: 12px; text-transform: uppercase; padding: 15px 10px; }
        td { padding: 15px 10px; text-align: center; font-size: 17px; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.03); }

        .val-high { color: var(--apple-red); font-weight: 700; }

        /* Modal Apple Style */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); 
            backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 2000; 
        }
        .modal-content { 
            background: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 30px; 
            width: 90%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        input { 
            width: 100%; padding: 14px; margin: 8px 0 18px 0; border-radius: 12px; 
            border: 1px solid #ddd; font-size: 16px; box-sizing: border-box;
        }
    </style>
</head>
<body>

<header>Salute Personale</header>

<div class="container">
    <div id="status">Stato: <span id="statusText">Inizializzazione...</span></div>

    <button type="button" class="collapsible">⚙️ Impostazioni Cloud</button>
    <div class="content" id="setupArea">
        <input type="password" id="ghToken" placeholder="Personal Access Token">
        <input type="text" id="ghRepo" placeholder="utente/nome-repo">
        <button class="primary" style="width:100%" onclick="saveSetup()">Connetti</button>
    </div>

    <div class="actions">
        <button class="primary" onclick="openModal()">+ Nuova Misura</button>
        <button class="primary" onclick="window.location.href='graphic.html'" style="background: #5856d6;">📊 Grafico</button>
        <button class="success" onclick="ghFetch()">🔄 Sincronizza</button>
        <button class="export" onclick="exportCSV()">Esporta CSV</button>
    </div>

    <div id="tableContainer"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0">Nuova Misurazione</h3>
        <div style="display:flex; gap:10px">
            <div style="flex:1"><label>Data</label><input type="date" id="data"></div>
            <div style="flex:1"><label>Ora</label><input type="time" id="ora"></div>
        </div>
        <div style="display:flex; gap:10px">
            <div style="flex:1"><label>Sistolica (MAX)</label><input type="number" id="massima" placeholder="120"></div>
            <div style="flex:1"><label>Diastolica (MIN)</label><input type="number" id="minima" placeholder="80"></div>
        </div>
        <label>Pulsazioni (BPM)</label>
        <input type="number" id="pulsazioni" placeholder="70">

        <div class="actions" style="justify-content: flex-end; margin-top: 10px;">
            <button onclick="closeModal()">Annulla</button>
            <button class="primary" onclick="saveData()">Salva Dati</button>
        </div>
    </div>
</div>

<script>
let records=[], editIndex=-1, config=JSON.parse(localStorage.getItem('gh_health_config'))||null, fileSha="";

// GitHub Logic
function saveSetup(){
    const token=document.getElementById('ghToken').value.trim();
    const repo=document.getElementById('ghRepo').value.trim();
    if(token && repo){ localStorage.setItem('gh_health_config', JSON.stringify({token,repo})); location.reload(); }
}

function setStatus(msg,color='black'){ 
    document.getElementById('statusText').innerText=msg; 
    document.getElementById('statusText').style.color=color; 
}

async function ghFetch(){
    if(!config) return;
    setStatus("Sincronizzazione...", "var(--apple-blue)");
    const url=`https://api.github.com/repos/${config.repo}/contents/dati.json`;
    try {
        const res=await fetch(url,{ headers:{ Authorization:`token ${config.token}`} });
        if(res.ok){
            const data=await res.json();
            fileSha=data.sha;
            records=JSON.parse(atob(data.content));
            records.sort((a,b)=> new Date(b.data+" "+b.ora) - new Date(a.data+" "+a.ora));
            renderTable();
            setStatus("Aggiornato", "var(--apple-green)");
        }
    } catch(e){ setStatus("Errore connessione", "red"); }
}

async function ghPush(){
    if(!config) return;
    const url=`https://api.github.com/repos/${config.repo}/contents/dati.json`;
    const body={ message:"Update salute", content:btoa(JSON.stringify(records,null,2)), sha:fileSha };
    const res=await fetch(url,{ method:"PUT", headers:{ Authorization:`token ${config.token}`}, body:JSON.stringify(body) });
    if(res.ok) { 
        const data=await res.json(); 
        fileSha=data.content.sha; 
        setStatus("Salvato su Cloud", "var(--apple-green)");
    }
}

// UI Logic
function openModal(index=-1){
    if(index>=0){
        const r=records[index];
        data.value=r.data; ora.value=r.ora;
        massima.value=r.massima; minima.value=r.minima;
        pulsazioni.value=r.pulsazioni || r.bpm;
        editIndex=index;
    } else {
        const now = new Date();
        data.value = now.toISOString().split('T')[0];
        ora.value = now.toTimeString().slice(0,5);
        massima.value=""; minima.value=""; pulsazioni.value="";
        editIndex=-1;
    }
    document.getElementById('modal').style.display="flex";
}

function closeModal(){ document.getElementById('modal').style.display="none"; }

function saveData(){
    const r={ 
        data:data.value, ora:ora.value, 
        massima:parseInt(massima.value), minima:parseInt(minima.value), 
        pulsazioni:parseInt(pulsazioni.value) 
    };
    if(editIndex>=0) records[editIndex]=r; else records.unshift(r);
    records.sort((a,b)=> new Date(b.data+" "+b.ora) - new Date(a.data+" "+a.ora));
    renderTable(); ghPush(); closeModal();
}

function deleteRecord(i){
    if(confirm("Eliminare definitivamente questa misura?")){
        records.splice(i,1); renderTable(); ghPush();
    }
}

function renderTable(){
    const container=document.getElementById("tableContainer");
    container.innerHTML="";
    if(records.length===0) return;

    let grouped={};
    records.forEach((r,i)=>{
        const month=r.data.substring(0,7);
        if(!grouped[month]) grouped[month]=[];
        grouped[month].push({...r, originalIndex: i});
    });

    const sortedMonths = Object.keys(grouped).sort().reverse();

    sortedMonths.forEach((m, idx)=>{
        const dateObj = new Date(m + "-01");
        const monthLabel = dateObj.toLocaleString('it-IT', { month: 'long', year: 'numeric' });
        
        const section = document.createElement("div");
        section.className = "month-section";
        
        const isFirst = idx === 0;
        
        section.innerHTML = `
            <div class="month-header" onclick="toggleSection(this)">
                <span>${monthLabel.toUpperCase()}</span>
                <span class="arrow">${isFirst ? '▼' : '▶'}</span>
            </div>
            <div class="table-container" style="display: ${isFirst ? 'block' : 'none'}">
                <table>
                    <tr><th>Data</th><th>Pressione</th><th>BPM</th><th></th></tr>
                    ${grouped[m].map(r => `
                        <tr>
                            <td style="font-size:13px">${r.data}<br><small style="color:#888">${r.ora}</small></td>
                            <td>
                                <span class="${r.massima >= 140 ? 'val-high' : ''}">${r.massima}</span> / 
                                <span class="${r.minima >= 90 ? 'val-high' : ''}">${r.minima}</span>
                            </td>
                            <td>${r.pulsazioni || '-'}</td>
                            <td>
                                <button class="warning" onclick="openModal(${r.originalIndex})" style="padding:5px 10px">✏️</button>
                                <button class="danger" onclick="deleteRecord(${r.originalIndex})" style="padding:5px 10px">🗑️</button>
                            </td>
                        </tr>
                    `).join('')}
                </table>
            </div>
        `;
        container.appendChild(section);
    });
}

function toggleSection(header){
    const content = header.nextElementSibling;
    const arrow = header.querySelector('.arrow');
    if(content.style.display === "none"){
        content.style.display = "block";
        arrow.innerText = "▼";
    } else {
        content.style.display = "none";
        arrow.innerText = "▶";
    }
}

function exportCSV(){
    let csv="Data,Ora,Massima,Minima,Pulsazioni\n";
    records.forEach(r=>{ csv+=`${r.data},${r.ora},${r.massima},${r.minima},${r.pulsazioni}\n`; });
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="misure_salute.csv";
    a.click();
}

// Collapsible Settings
document.querySelector(".collapsible").addEventListener("click", function(){
    const content = this.nextElementSibling;
    content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
});

if(config) ghFetch();
</script>
</body>
</html>
