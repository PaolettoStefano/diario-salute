<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafico Parametri Vitali - Glass Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
            --apple-blue: #007aff;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
            --apple-green: #34c759;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
            min-height: 100vh;
            color: #1d1d1f; 
        }

        header { 
            background: rgba(29, 29, 31, 0.85); 
            backdrop-filter: blur(15px);
            color: white; 
            padding: 20px; 
            text-align: center; 
            font-size: 24px; 
            font-weight: 600; 
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .back-btn { 
            position: absolute; 
            left: 20px; 
            top: 50%;
            transform: translateY(-50%);
            color: white; 
            text-decoration: none; 
            font-size: 14px; 
            background: rgba(255,255,255,0.15); 
            padding: 8px 15px; 
            border-radius: 12px; 
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
        }

        .container { 
            padding: 20px; 
            max-width: 1200px; 
            margin: auto; 
        }

        #status { 
            margin: 15px 0; 
            font-size: 14px; 
            text-align: center; 
            font-weight: 500;
        }

        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px; 
            border-radius: 28px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); 
            margin-bottom: 30px; 
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 25px; 
        }

        button { 
            padding: 10px 18px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
            cursor: pointer; 
            font-weight: 600; 
            background: white;
            color: var(--apple-blue);
            transition: 0.3s;
        }

        button:hover { background: var(--apple-blue); color: white; }

        .legend-alert {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<header>
    <a href="javascript:history.back()" class="back-btn">← Home</a>
    Monitoraggio Clinico
</header>

<div class="container">
    <div id="status">Sincronizzazione in corso...</div>

    <div class="controls">
        <button onclick="updateChart('all')">Storico Completo</button>
        <button onclick="updateChart(30)">Ultimi 30 Giorni</button>
        <button onclick="updateChart(7)">Settimana</button>
    </div>

    <div class="legend-alert">
        <span style="color: var(--apple-red)">● Limite Sistolica: 140 mmHg</span>
        <span style="color: var(--apple-orange)">● Limite Diastolica: 90 mmHg</span>
    </div>

    <div class="card">
        <div style="height: 550px;">
            <canvas id="healthChart"></canvas>
        </div>
    </div>
</div>

<script>
    let records = [];
    let healthChart = null;
    const config = JSON.parse(localStorage.getItem('gh_health_config'));

    async function fetchData() {
        if (!config) return;
        const url = `https://api.github.com/repos/${config.repo}/contents/dati.json`;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${config.token}` } });
            if (res.ok) {
                const data = await res.json();
                records = JSON.parse(atob(data.content));
                records.sort((a, b) => new Date(a.data + " " + a.ora) - new Date(b.data + " " + b.ora));
                document.getElementById('status').innerText = "Dati Clinici Aggiornati";
                updateChart('all');
            }
        } catch (e) { console.error(e); }
    }

    function updateChart(filter) {
        const ctx = document.getElementById('healthChart').getContext('2d');
        let dataToShow = records;

        if (filter !== 'all') {
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - filter);
            dataToShow = records.filter(r => new Date(r.data) >= cutoff);
        }

        const labels = dataToShow.map(r => {
            const d = new Date(r.data);
            return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) + " " + r.ora;
        });
        
        if (healthChart) healthChart.destroy();

        healthChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Sistolica (MAX)',
                        data: dataToShow.map(r => r.massima),
                        borderColor: '#ff3b30',
                        backgroundColor: 'rgba(255, 59, 48, 0.1)',
                        borderWidth: 4,
                        tension: 0.3,
                        pointRadius: dataToShow.map(r => r.massima >= 140 ? 8 : 4),
                        pointBackgroundColor: dataToShow.map(r => r.massima >= 140 ? '#ff3b30' : 'white'),
                        pointBorderWidth: 2,
                        zIndex: 10
                    },
                    {
                        label: 'Diastolica (MIN)',
                        data: dataToShow.map(r => r.minima),
                        borderColor: '#ff9500',
                        borderWidth: 4,
                        tension: 0.3,
                        pointRadius: dataToShow.map(r => r.minima >= 90 ? 8 : 4),
                        pointBackgroundColor: dataToShow.map(r => r.minima >= 90 ? '#ff9500' : 'white'),
                        pointBorderWidth: 2,
                        zIndex: 10
                    },
                    {
                        label: 'Battiti (BPM)',
                        data: dataToShow.map(r => r.pulsazioni),
                        borderColor: '#007aff',
                        borderWidth: 2,
                        borderDash: [3, 3],
                        pointRadius: 2,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 20 } },
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        padding: 15,
                        bodyFont: { size: 14 }
                    }
                },
                scales: {
                    y: { 
                        min: 40,
                        max: 200,
                        grid: {
                            color: (context) => {
                                if (context.tick.value === 140 || context.tick.value === 90) return 'rgba(0,0,0,0.3)';
                                return 'rgba(0,0,0,0.05)';
                            },
                            lineWidth: (context) => (context.tick.value === 140 || context.tick.value === 90 ? 2 : 1)
                        },
                        ticks: {
                            callback: function(value) {
                                if (value === 140) return '140 (LIMITE MAX)';
                                if (value === 90) return '90 (LIMITE MIN)';
                                return value;
                            },
                            font: (context) => {
                                if (context.tick.value === 140 || context.tick.value === 90) return { weight: 'bold' };
                            },
                            color: (context) => {
                                if (context.tick.value === 140) return '#ff3b30';
                                if (context.tick.value === 90) return '#ff9500';
                            }
                        }
                    },
                    x: {
                        ticks: { maxRotation: 45, minRotation: 45, font: { size: 11 }, autoSkip: false }
                    }
                }
            },
            plugins: [{
                id: 'limitLines',
                beforeDraw: (chart) => {
                    const {ctx, chartArea: {left, right, top, bottom}, scales: {y}} = chart;
                    
                    // Area allerta Sistolica (Sopra 140)
                    ctx.fillStyle = 'rgba(255, 59, 48, 0.05)';
                    ctx.fillRect(left, top, right - left, y.getPixelForValue(140) - top);
                    
                    // Linea 140
                    ctx.save();
                    ctx.strokeStyle = '#ff3b30';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([10, 5]);
                    ctx.beginPath();
                    ctx.moveTo(left, y.getPixelForValue(140));
                    ctx.lineTo(right, y.getPixelForValue(140));
                    ctx.stroke();
                    ctx.restore();

                    // Linea 90
                    ctx.save();
                    ctx.strokeStyle = '#ff9500';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([10, 5]);
                    ctx.beginPath();
                    ctx.moveTo(left, y.getPixelForValue(90));
                    ctx.lineTo(right, y.getPixelForValue(90));
                    ctx.stroke();
                    ctx.restore();
                }
            }]
        });
    }

    fetchData();
</script>

</body>
</html>
