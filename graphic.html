<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Clinica - Glass Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.8);
            --apple-blue: #007aff;
            --apple-red: #ff3b30;
            --apple-orange: #ff9500;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
            min-height: 100vh;
        }

        header { 
            background: rgba(29, 29, 31, 0.9); 
            backdrop-filter: blur(15px);
            color: white; padding: 20px; text-align: center; font-size: 22px; font-weight: 600;
        }

        .back-btn { position: absolute; left: 20px; color: white; text-decoration: none; font-size: 14px; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 12px; }

        .container { padding: 20px; max-width: 1100px; margin: auto; }

        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px);
            padding: 25px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            margin-top: 20px;
        }

        .controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        
        button { 
            padding: 10px 15px; border-radius: 12px; border: 1px solid #ddd; 
            cursor: pointer; background: white; font-weight: 600; color: var(--apple-blue);
        }

        button.active { background: var(--apple-blue); color: white; border-color: var(--apple-blue); }

        input[type="number"] {
            width: 60px; padding: 10px; border-radius: 12px; border: 1px solid #ddd; text-align: center; font-weight: 600;
        }

        #status { text-align: center; font-size: 14px; margin-bottom: 10px; color: #666; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">← Lista</a>
    Analisi Parametri
</header>

<div class="container">
    <div id="status">Caricamento dati...</div>

    <div class="controls">
        <button id="btn-all" onclick="updateChart('all')" class="active">Tutti</button>
        <button id="btn-30" onclick="updateChart(30)">30 GG</button>
        <button id="btn-7" onclick="updateChart(7)">7 GG</button>
        <button id="btn-3" onclick="updateChart(3)">3 GG</button>
        <div style="display:flex; align-items:center; gap:5px; margin-left:10px;">
            <span style="font-size:13px; font-weight:600; color:#555;">Personalizza:</span>
            <input type="number" id="custom-days" value="5" min="1">
            <button onclick="updateChart(document.getElementById('custom-days').value)">Vai</button>
        </div>
    </div>

    <div class="card">
        <div style="position: relative; height:60vh; width:100%">
            <canvas id="healthChart"></canvas>
        </div>
    </div>
</div>

<script>
    let records = [];
    let healthChart = null;
    const config = JSON.parse(localStorage.getItem('gh_health_config'));

    async function fetchData() {
        if (!config) {
            document.getElementById('status').innerText = "Errore: Configura GitHub nella home";
            return;
        }

        const url = `https://api.github.com/repos/${config.repo}/contents/dati.json`;
        try {
            const res = await fetch(url, { headers: { Authorization: `token ${config.token}` } });
            if (res.ok) {
                const data = await res.json();
                records = JSON.parse(atob(data.content));
                
                records.sort((a, b) => new Date(a.data + " " + a.ora) - new Date(b.data + " " + b.ora));
                
                document.getElementById('status').innerText = `Trovate ${records.length} misurazioni`;
                updateChart('all');
            } else {
                document.getElementById('status').innerText = "Errore nel caricamento dei dati";
            }
        } catch (e) {
            document.getElementById('status').innerText = "Errore di connessione";
        }
    }

    // Funzione per calcolare la linea di tendenza (Regressione Lineare)
    function calculateTrendline(data) {
        const n = data.length;
        if (n < 2) return null;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        for (let i = 0; i < n; i++) {
            sumX += i;
            sumY += data[i];
            sumXY += i * data[i];
            sumXX += i * i;
        }
        const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
        const intercept = (sumY - slope * sumX) / n;
        return data.map((_, i) => slope * i + intercept);
    }

    function updateChart(filter) {
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        if(filter === 'all') document.getElementById('btn-all').classList.add('active');
        else if(document.getElementById('btn-' + filter)) document.getElementById('btn-' + filter).classList.add('active');

        const ctx = document.getElementById('healthChart').getContext('2d');
        let dataToShow = [...records];

        if (filter !== 'all') {
            const cutoff = new Date();
            cutoff.setHours(0,0,0,0);
            cutoff.setDate(cutoff.getDate() - filter);
            dataToShow = records.filter(r => new Date(r.data) >= cutoff);
        }

        if (dataToShow.length === 0) {
            document.getElementById('status').innerText = "Nessun dato nel periodo selezionato";
            if(healthChart) healthChart.destroy();
            return;
        }

        const labels = dataToShow.map(r => {
            const d = new Date(r.data);
            return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'}) + " " + r.ora;
        });

        const sysData = dataToShow.map(r => parseInt(r.massima));
        const diaData = dataToShow.map(r => parseInt(r.minima));
        const bpmData = dataToShow.map(r => parseInt(r.pulsazioni || r.bpm || 0));

        const sysTrend = calculateTrendline(sysData);
        const diaTrend = calculateTrendline(diaData);

        if (healthChart) healthChart.destroy();

        healthChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Sistolica (MAX)',
                        data: sysData,
                        borderColor: '#ff3b30',
                        backgroundColor: 'rgba(255, 59, 48, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: sysData.map(v => v >= 140 ? 7 : 4),
                        pointBackgroundColor: sysData.map(v => v >= 140 ? '#ff3b30' : 'white'),
                        zIndex: 10
                    },
                    {
                        label: 'Trend MAX',
                        data: sysTrend,
                        borderColor: 'rgba(255, 59, 48, 0.4)',
                        borderWidth: 2,
                        borderDash: [10, 5],
                        pointRadius: 0,
                        fill: false,
                        tension: 0
                    },
                    {
                        label: 'Diastolica (MIN)',
                        data: diaData,
                        borderColor: '#ff9500',
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: diaData.map(v => v >= 90 ? 7 : 4),
                        pointBackgroundColor: diaData.map(v => v >= 90 ? '#ff9500' : 'white'),
                        zIndex: 10
                    },
                    {
                        label: 'Trend MIN',
                        data: diaTrend,
                        borderColor: 'rgba(255, 149, 0, 0.4)',
                        borderWidth: 2,
                        borderDash: [10, 5],
                        pointRadius: 0,
                        fill: false,
                        tension: 0
                    },
                    {
                        label: 'BPM',
                        data: bpmData,
                        borderColor: '#007aff',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 2,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { 
                        position: 'top',
                        labels: {
                            filter: (item) => !item.text.includes('Trend') // Nasconde i trend dalla legenda per pulizia
                        }
                    },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        suggestedMin: 50,
                        suggestedMax: 160,
                        grid: {
                            color: (context) => {
                                if (context.tick.value === 140 || context.tick.value === 90) return 'rgba(255, 0, 0, 0.4)';
                                return 'rgba(0,0,0,0.05)';
                            }
                        },
                        ticks: {
                            callback: function(value) {
                                if (value === 140) return '140 - LIMITE MAX';
                                if (value === 90) return '90 - LIMITE MIN';
                                return value;
                            }
                        }
                    },
                    x: {
                        ticks: { autoSkip: false, maxRotation: 45, minRotation: 45, font: { size: 10 } }
                    }
                }
            },
            plugins: [{
                beforeDraw: (chart) => {
                    const {ctx, chartArea: {left, right, top, bottom}, scales: {y}} = chart;
                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 59, 48, 0.05)';
                    ctx.fillRect(left, top, right - left, y.getPixelForValue(140) - top);
                    ctx.fillStyle = 'rgba(255, 149, 0, 0.05)';
                    ctx.fillRect(left, y.getPixelForValue(140), right - left, y.getPixelForValue(90) - y.getPixelForValue(140));
                    ctx.restore();
                }
            }]
        });
    }

    fetchData();
</script>

</body>
</html>
